<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#dbeafe" />
  <title>제휴 문의</title>
  <script>
    const savedTheme = localStorage.getItem('lottoTheme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');

    document.documentElement.dataset.theme = initialTheme;
    document.querySelector('meta[name="theme-color"]').setAttribute(
      'content',
      initialTheme === 'dark' ? '#020617' : '#dbeafe'
    );
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root,
    html[data-theme="light"] {
      color-scheme: light;
      --page-bg: linear-gradient(135deg, #dbeafe, #ede9fe);
      --panel-bg: #ffffff;
      --title-color: #111827;
      --text-color: #222222;
      --muted-color: #555555;
      --button-bg: #111827;
      --button-hover-bg: #2563eb;
      --button-text: #ffffff;
      --field-bg: #ffffff;
      --field-border: #d1d5db;
      --field-focus: #2563eb;
      --toggle-bg: #f3f4f6;
      --toggle-border: #d1d5db;
      --toggle-active-bg: #111827;
      --toggle-active-text: #ffffff;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.16);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: linear-gradient(135deg, #020617, #312e81);
      --panel-bg: #111827;
      --title-color: #f9fafb;
      --text-color: #e5e7eb;
      --muted-color: #d1d5db;
      --button-bg: #f9fafb;
      --button-hover-bg: #60a5fa;
      --button-text: #111827;
      --field-bg: #020617;
      --field-border: #374151;
      --field-focus: #60a5fa;
      --toggle-bg: #1f2937;
      --toggle-border: #374151;
      --toggle-active-bg: #f9fafb;
      --toggle-active-text: #111827;
      --shadow: 0 20px 55px rgba(0, 0, 0, 0.38);
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: var(--page-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
      padding: 20px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: var(--panel-bg);
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: var(--shadow);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    h1 {
      margin-bottom: 8px;
      color: var(--title-color);
      font-size: 34px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 24px;
      color: var(--muted-color);
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
    }

    .theme-toggle {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: max-content;
      padding: 4px;
      margin: 0 auto 26px;
      border: 1px solid var(--toggle-border);
      border-radius: 999px;
      background: var(--toggle-bg);
    }

    .theme-option {
      min-width: 76px;
      border: none;
      border-radius: 999px;
      padding: 9px 14px;
      background: transparent;
      color: var(--muted-color);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .theme-option:hover {
      color: var(--title-color);
    }

    .theme-option.active {
      background: var(--toggle-active-bg);
      color: var(--toggle-active-text);
    }

    .partner-form {
      text-align: left;
    }

    .form-row {
      margin-bottom: 16px;
    }

    .form-row label {
      display: block;
      margin-bottom: 7px;
      color: var(--title-color);
      font-size: 14px;
      font-weight: 700;
    }

    .form-row input,
    .form-row textarea {
      width: 100%;
      border: 1px solid var(--field-border);
      border-radius: 12px;
      padding: 13px 14px;
      background: var(--field-bg);
      color: var(--text-color);
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-row textarea {
      min-height: 140px;
      resize: vertical;
    }

    .form-row input:focus,
    .form-row textarea:focus {
      border-color: var(--field-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
    }

    button:not(.theme-option) {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 15px 28px;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    button:not(.theme-option):hover {
      background: var(--button-hover-bg);
      transform: translateY(-2px);
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 28px;
      }

      .container {
        padding: 32px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>제휴 문의</h1>
    <p class="subtitle">광고, 콘텐츠, 서비스 제휴 제안을 남겨주시면 확인 후 회신드리겠습니다.</p>

    <div class="theme-toggle" aria-label="화면 테마 선택">
      <button class="theme-option active" type="button" data-theme="light" aria-pressed="true">화이트</button>
      <button class="theme-option" type="button" data-theme="dark" aria-pressed="false">다크</button>
    </div>

    <form class="partner-form" action="https://formspree.io/f/xdabdvjp" method="POST">
      <input type="hidden" name="_subject" value="로또 번호 추천기 제휴 문의" />

      <div class="form-row">
        <label for="company">회사명</label>
        <input type="text" id="company" name="company" autocomplete="organization" placeholder="회사 또는 브랜드명" required />
      </div>

      <div class="form-row">
        <label for="name">담당자명</label>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="성함" required />
      </div>

      <div class="form-row">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" required />
      </div>

      <div class="form-row">
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" placeholder="제휴 목적, 제안 내용, 희망 일정 등을 적어주세요." required></textarea>
      </div>

      <button type="submit">제휴 문의 보내기</button>
    </form>
  </div>

  <script>
    const themeButtons = document.querySelectorAll('.theme-option');
    const themeColorMeta = document.querySelector('meta[name="theme-color"]');

    function setTheme(theme) {
      const isDark = theme === 'dark';

      document.documentElement.dataset.theme = theme;
      themeColorMeta.setAttribute('content', isDark ? '#020617' : '#dbeafe');
      localStorage.setItem('lottoTheme', theme);

      themeButtons.forEach((button) => {
        const isActive = button.dataset.theme === theme;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });
    }

    themeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        setTheme(button.dataset.theme);
      });
    });

    setTheme(initialTheme);
  </script>
</body>
</html>
