<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추천기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;
      --page-bg: linear-gradient(135deg, #dbeafe, #ede9fe);
      --panel-bg: #ffffff;
      --title-color: #111827;
      --text-color: #222222;
      --muted-color: #555555;
      --subtle-color: #666666;
      --button-bg: #111827;
      --button-hover-bg: #2563eb;
      --button-text: #ffffff;
      --toggle-bg: #f3f4f6;
      --toggle-border: #d1d5db;
      --toggle-active-bg: #111827;
      --toggle-active-text: #ffffff;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.16);
    }

    body.dark-mode {
      color-scheme: dark;
      --page-bg: linear-gradient(135deg, #020617, #312e81);
      --panel-bg: #111827;
      --title-color: #f9fafb;
      --text-color: #e5e7eb;
      --muted-color: #d1d5db;
      --subtle-color: #cbd5e1;
      --button-bg: #f9fafb;
      --button-hover-bg: #60a5fa;
      --button-text: #111827;
      --toggle-bg: #1f2937;
      --toggle-border: #374151;
      --toggle-active-bg: #f9fafb;
      --toggle-active-text: #111827;
      --shadow: 0 20px 55px rgba(0, 0, 0, 0.38);
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: var(--page-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
      padding: 20px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: var(--panel-bg);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
      color: var(--title-color);
    }

    .subtitle {
      font-size: 16px;
      color: var(--muted-color);
      margin-bottom: 30px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--toggle-border);
      border-radius: 999px;
      background: var(--toggle-bg);
    }

    .theme-option {
      min-width: 76px;
      border: none;
      border-radius: 999px;
      padding: 9px 14px;
      margin: 0;
      background: transparent;
      color: var(--muted-color);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .theme-option:hover {
      background: transparent;
      color: var(--title-color);
      transform: none;
    }

    .theme-option.active {
      background: var(--toggle-active-bg);
      color: var(--toggle-active-text);
    }

    .lotto-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 28px 0;
      min-height: 70px;
    }

    .ball {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      color: white;
      box-shadow: inset -4px -6px 10px rgba(0, 0, 0, 0.2),
                  0 5px 12px rgba(0, 0, 0, 0.18);
      animation: pop 0.3s ease;
    }

    .bonus-title {
      margin-top: 18px;
      font-size: 17px;
      color: var(--muted-color);
      font-weight: bold;
    }

    .bonus-box {
      display: flex;
      justify-content: center;
      margin-top: 12px;
      min-height: 60px;
    }

    .yellow { background: #f59e0b; }
    .blue { background: #2563eb; }
    .red { background: #ef4444; }
    .gray { background: #6b7280; }
    .green { background: #16a34a; }
    .purple { background: #7c3aed; }

    button:not(.theme-option) {
      border: none;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 18px;
      font-weight: bold;
      padding: 15px 28px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 15px;
    }

    button:not(.theme-option):hover {
      background: var(--button-hover-bg);
      transform: translateY(-2px);
    }

    .description {
      margin-top: 25px;
      font-size: 14px;
      color: var(--subtle-color);
      line-height: 1.6;
    }

    @keyframes pop {
      from {
        transform: scale(0.4);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 28px;
      }

      .ball {
        width: 48px;
        height: 48px;
        font-size: 19px;
      }

      .container {
        padding: 32px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>로또 번호 추천기</h1>
    <p class="subtitle">버튼을 누르면 무작위 로또 번호 6개와 보너스 번호 1개를 추천합니다.</p>

    <div class="theme-toggle" aria-label="화면 테마 선택">
      <button class="theme-option active" type="button" data-theme="light" aria-pressed="true">화이트</button>
      <button class="theme-option" type="button" data-theme="dark" aria-pressed="false">다크</button>
    </div>

    <div id="lottoBox" class="lotto-box">
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
    </div>

    <button onclick="generateLotto()">로또 번호 추천받기</button>

    <div class="bonus-title">보너스 번호</div>
    <div id="bonusBox" class="bonus-box">
      <div class="ball purple">?</div>
    </div>

    <p class="description">
      이 번호는 JavaScript의 무작위 추첨 방식으로 생성됩니다.<br />
      실제 당첨을 보장하지 않으며 재미와 참고용으로만 사용하세요.
    </p>
  </div>

  <script>
    const themeButtons = document.querySelectorAll('.theme-option');

    function setTheme(theme) {
      const isDark = theme === 'dark';

      document.body.classList.toggle('dark-mode', isDark);
      localStorage.setItem('lottoTheme', theme);

      themeButtons.forEach((button) => {
        const isActive = button.dataset.theme === theme;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });
    }

    themeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        setTheme(button.dataset.theme);
      });
    });

    setTheme(localStorage.getItem('lottoTheme') || 'light');

    function getBallColor(number) {
      if (number <= 10) return 'yellow';
      if (number <= 20) return 'blue';
      if (number <= 30) return 'red';
      if (number <= 40) return 'gray';
      return 'green';
    }

    function generateLotto() {
      const numbers = [];

      while (numbers.length < 7) {
        const randomNumber = Math.floor(Math.random() * 45) + 1;

        if (!numbers.includes(randomNumber)) {
          numbers.push(randomNumber);
        }
      }

      const mainNumbers = numbers.slice(0, 6).sort((a, b) => a - b);
      const bonusNumber = numbers[6];

      const lottoBox = document.getElementById('lottoBox');
      const bonusBox = document.getElementById('bonusBox');

      lottoBox.innerHTML = '';
      bonusBox.innerHTML = '';

      mainNumbers.forEach((number) => {
        const ball = document.createElement('div');
        ball.className = `ball ${getBallColor(number)}`;
        ball.textContent = number;
        lottoBox.appendChild(ball);
      });

      const bonusBall = document.createElement('div');
      bonusBall.className = `ball ${getBallColor(bonusNumber)}`;
      bonusBall.textContent = bonusNumber;
      bonusBox.appendChild(bonusBall);
    }
  </script>
</body>
</html>
