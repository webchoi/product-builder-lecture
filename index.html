<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추천기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3a8a, #7c3aed);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #222;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
      color: #111827;
    }

    .subtitle {
      font-size: 16px;
      color: #555;
      margin-bottom: 30px;
    }

    .lotto-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 28px 0;
      min-height: 70px;
    }

    .ball {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      color: white;
      box-shadow: inset -4px -6px 10px rgba(0, 0, 0, 0.2),
                  0 5px 12px rgba(0, 0, 0, 0.18);
      animation: pop 0.3s ease;
    }

    .bonus-title {
      margin-top: 18px;
      font-size: 17px;
      color: #444;
      font-weight: bold;
    }

    .bonus-box {
      display: flex;
      justify-content: center;
      margin-top: 12px;
      min-height: 60px;
    }

    .yellow { background: #f59e0b; }
    .blue { background: #2563eb; }
    .red { background: #ef4444; }
    .gray { background: #6b7280; }
    .green { background: #16a34a; }
    .purple { background: #7c3aed; }

    button {
      border: none;
      background: #111827;
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 15px 28px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 15px;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .description {
      margin-top: 25px;
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    @keyframes pop {
      from {
        transform: scale(0.4);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 28px;
      }

      .ball {
        width: 48px;
        height: 48px;
        font-size: 19px;
      }

      .container {
        padding: 32px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>로또 번호 추천기</h1>
    <p class="subtitle">버튼을 누르면 무작위 로또 번호 6개와 보너스 번호 1개를 추천합니다.</p>

    <div id="lottoBox" class="lotto-box">
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
      <div class="ball gray">?</div>
    </div>

    <button onclick="generateLotto()">로또 번호 추천받기</button>

    <div class="bonus-title">보너스 번호</div>
    <div id="bonusBox" class="bonus-box">
      <div class="ball purple">?</div>
    </div>

    <p class="description">
      이 번호는 JavaScript의 무작위 추첨 방식으로 생성됩니다.<br />
      실제 당첨을 보장하지 않으며 재미와 참고용으로만 사용하세요.
    </p>
  </div>

  <script>
    function getBallColor(number) {
      if (number <= 10) return 'yellow';
      if (number <= 20) return 'blue';
      if (number <= 30) return 'red';
      if (number <= 40) return 'gray';
      return 'green';
    }

    function generateLotto() {
      const numbers = [];

      while (numbers.length < 7) {
        const randomNumber = Math.floor(Math.random() * 45) + 1;

        if (!numbers.includes(randomNumber)) {
          numbers.push(randomNumber);
        }
      }

      const mainNumbers = numbers.slice(0, 6).sort((a, b) => a - b);
      const bonusNumber = numbers[6];

      const lottoBox = document.getElementById('lottoBox');
      const bonusBox = document.getElementById('bonusBox');

      lottoBox.innerHTML = '';
      bonusBox.innerHTML = '';

      mainNumbers.forEach((number) => {
        const ball = document.createElement('div');
        ball.className = `ball ${getBallColor(number)}`;
        ball.textContent = number;
        lottoBox.appendChild(ball);
      });

      const bonusBall = document.createElement('div');
      bonusBall.className = `ball ${getBallColor(bonusNumber)}`;
      bonusBall.textContent = bonusNumber;
      bonusBox.appendChild(bonusBall);
    }
  </script>
</body>
</html>
